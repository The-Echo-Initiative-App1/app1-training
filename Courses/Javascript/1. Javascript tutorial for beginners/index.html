<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <label id="countLabel">0</label><br>
   <div id="btnContainer>"
    <button id="decreasebtn" class="buttons">Decrease</button>
    <button id="resetbtn" class="buttons">reset</button>
    <button id="increasebtn" class="buttons">Increase</button>
    </div>

     <div id="interactive-box">
        <p>Interact with me!</p>
        <span id="coords">X: 0, Y: 0</span>
    </div>

  
    <div id="status-log">Last Action: None</div>

    <div id="key-container">
        <div id="key-display">Press any key</div>
        <div id="key-details">Waiting for input...</div>
    </div>

   
    <div class="modifiers">
        <span id="mod-shift" class="badge">Shift</span>
        <span id="mod-ctrl" class="badge">Ctrl</span>
        <span id="mod-alt" class="badge">Alt</span>
    </div>



    <div class="list-wrapper">
        <h2>Shopping List</h2>
        
    
        <div class="list-item">Apple 🍎</div>
        <div class="list-item">Banana 🍌</div>
        <div class="list-item">Cherry 🍒</div>
        <div class="list-item">Date 🌴</div>

        <button id="action-btn">Highlight Everything</button>
    </div>


    <script src="index.js" ></script>

</body>
</html>
