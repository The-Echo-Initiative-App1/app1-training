<!DOCTYPE html>
<html>
    <head>
        <title>Document</title>
    </head>
    <body>
        <form action="index.phb";method="post" enctype="multipart/form-data">
            <label for="Username">Username:</label>
            <input type="text";id="Username"  placeholder="fill"  minlength="6" maxlength="12" required> <br>
            
            <label for="password">Password:</label>
            <input type="password"  id="password" placeholder="fill" minlength="6" maxlength="12" required><br>
           
            <label for="email">email:</label>
            <input type="email"  id="email" placeholder="fill" required><br>
            
            <label for="phone">phonenumber:</label>
            <input type="tel"  id="phone" placeholder="fill" pattern="[0-9]" required><br>
            
            <label for="bday">birthdate:</label>
            <input type="date"  id="bday" placeholder="fill" required><br>
            
            <label for="quantity"> quantity:</label>
            <input type="number"  id="quantity" placeholder="fill" min="0"max="50" required><br>
            <label for="title">title:</label>

            <label for="Mr.">Mr.:</label>
            <label for="Ms.">Ms.:</label>
            <label for="phD.">phD.:</label>
            
            <input type="radio"  id="Mr." value="Mr." name="title" >
            <input type="radio"  id="Ms." value="Ms." name="title">
            <input type="radio"  id="phD." value="phD." name="title"><br>
           
            <label for:"payment">payment</label>
            <select id ="payment">
                 <option value ="visa">visa</option>
                 <option value="mastercard">mastercard</option>
                 <option value="giftcard">giftcard</option>
            </select><br>
            <label for="subscribe">subscribe</label>
            <input type="checkbox" id="subscribe" ><br>
            <label for="comment">comment</label>
            <textarea id="comment" rows="3" cols="25" required></textarea><br>
            <label for="file">file</label>
            <input type="file" id="file" accept="image/png"><br>
            <input type="reset"><br>
            <input type="submit";value="Submit";>
        </form>
    </body>
</html>
